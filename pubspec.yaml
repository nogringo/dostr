name: ndk_workspace
publish_to: none
description: Workspace configuration for the NDK melos monorepo.

environment:
  sdk: '>=3.6.0 <4.0.0'
dev_dependencies:
  melos: ^7.8.1


workspace:
  - packages/ndk
  - packages/ndk_core
  - packages/nip01
  - packages/signer
  - packages/auth
  - packages/accounts
  - packages/follows
  - packages/metadatas
  - packages/lists
  - packages/search
  - packages/zaps
  - packages/cache
  - packages/nip11
  - packages/requests
  - packages/isolates
  - packages/logger
  - packages/nip19
  - packages/bip340
  - packages/nip44
  - packages/nip49
  - packages/nip77
  - packages/rust_verifier
  - packages/pq
  - packages/ndk_cache_manager_test_suite
  - packages/objectbox
  - packages/sembast
  - packages/drift
  - packages/cli
  - packages/sqlite3
  - packages/ndk_flutter
  - packages/wallets
  - packages/nwc
  - packages/cashu_protocol
  - packages/cashu
  - packages/blossom
  - packages/nip17
  - packages/nip59
  - packages/nip85
  - packages/nip13
  - packages/nip07
  - packages/nip46
  - packages/nip55
  - packages/nip82
  - packages/nip05
  - packages/broadcast_queue
  - packages/fetchers
  - packages/http
  - packages/url_set
  - packages/bc_ur

melos:
  command:
    version:
      hooks:
        preCommit: |
          melos exec --fail-fast --scope="ndk_core" -- "dart run tool/update_version.dart"
          git add packages/ndk_core/lib/src/version.dart

  scripts:
    analyze:
      exec: flutter analyze --fatal-infos --fatal-warnings .
      description: Analyze a specific package in this project.

    check-format:
      exec: dart format --set-exit-if-changed .
      description: Check the format of a specific package in this project.

    format:
      exec: dart format .
      description: Format a specific package in this project.


    build:
      run: melos run build:apple && melos run build:android && melos run build:other
      description: Build all native libraries for the project.

    build:apple:
      run: bash scripts/build-apple.sh
      description: Build the XCFramework for iOS and macOS.

    build:android:
      run: bash scripts/build-android.sh
      description: Build the .tar.gz for Android.

    build:other:
      run: bash scripts/build-other.sh
      description: Build the .tar.gz for all other platforms.

    test:
      run: melos run test:dart --no-select && melos run test:flutter --no-select
      description: Run all Dart & Flutter tests in this project.

    test:dart:
      run: melos exec -c 1 --fail-fast -- "dart test test"
      description: Run Dart tests for a specific package in this project.
      select-package:
        flutter: false
        dir-exists: test

    test:flutter:
      run: melos exec -c 1 --fail-fast -- "flutter test test"
      description: Run Flutter tests for a specific package in this project.
      select-package:
        flutter: true
        dir-exists: test
