            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/nip46
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/nip55
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: flutter analyze --fatal-infos --fatal-warnings .
          - package: ./packages/nip05
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/flutter
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: flutter analyze --fatal-infos --fatal-warnings .
          - package: ./packages/demo
            pub_get_directory: ./packages/demo
            pub_get_command: flutter pub get
            analyze_command: flutter analyze --fatal-infos --fatal-warnings .
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:"
          architecture: x64

      - name: Install dependencies
        working-directory: ${{ matrix.pub_get_directory }}
        run: ${{ matrix.pub_get_command }}

      - name: Analyze package
        working-directory: ${{ matrix.package }}
        run: ${{ matrix.analyze_command }}
