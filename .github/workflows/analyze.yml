name: analyze

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  analyze:
    name: Analyze the workspace and the sample app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # The sample app is not part of the workspace, so it resolves on its own.
      - name: Install dependencies
        run: |
          flutter pub get
          cd packages/demo && flutter pub get

      - name: Analyze
        run: dart analyze --fatal-infos .
