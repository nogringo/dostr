name: analyze

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./packages/event_verifier_test_suite
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/mock_relay
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/core
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/nip01
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/signer
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/accounts
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/zaps
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/nip11
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/nip19
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/bip340
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/nip44
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/nip49
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/nip77
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/rust_verifier
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/url_set
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/fetchers
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/home_relays
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/cashu_protocol
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/blossom
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/nip59
            pub_get_directory: .
            pub_get_command: dart pub get
            analyze_command: dart analyze --fatal-infos --fatal-warnings .
          - package: ./packages/nip85
