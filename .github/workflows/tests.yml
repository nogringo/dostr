name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, nip01, signer, nip19, bip340, nip44, nip49, nip77, rust_verifier, web_crypto, url_set, relay_url, blossom_url, fetchers, home_relays, cashu_protocol, blossom, nip59, nip13, nip07, nip46, nip05, accounts, zaps, nip11, mock_relay, string_color, nip55, flutter]
        include:
          - package: core
            test_command: dart test -j 1 && dart test -p chrome test/transport/websocket_client_transport_browser_test.dart
          - package: nip07
            test_command: dart test && dart test -p chrome -c dart2wasm
          - package: web_crypto
            test_command: dart test && dart test -p chrome -c dart2wasm
          - package: nip55
            test_command: flutter test
          - package: flutter
            test_command: flutter test --platform chrome --concurrency=2
    defaults:
      run:
        working-directory: ./packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - run: ${{ matrix.test_command || 'dart test' }}

  nip55-android:
    name: Test nip55 Android plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Robolectric needs Java 21 for Android 16 (API 36)
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          # Robolectric downloads its Android jar to ~/.m2, out of the default Gradle cache
          cache-path: |
            ~/.gradle/caches
            ~/.m2/repository/org/robolectric
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # A plugin only builds inside an app: the demo provides it, and this writes its gradlew and local.properties
      - run: flutter build apk --config-only
        working-directory: packages/demo
      - run: ./gradlew :dostr_nip55:testDebugUnitTest
        working-directory: packages/demo/android
