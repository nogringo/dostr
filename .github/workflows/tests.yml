name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  test:
    name: Test ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [core, nip01, signer, nip19, bip340, nip44, nip49, nip77, rust_verifier, web_crypto, url_set, fetchers, home_relays, cashu_protocol, blossom, nip59, nip85, nip13, nip07, nip46, nip05, accounts, zaps, nip11, mock_relay, nip55, flutter]
        include:
          - package: core
            test_command: dart test -j 1
          - package: nip55
            test_command: flutter test
          - package: flutter
            test_command: flutter test --platform chrome --concurrency=2
    defaults:
      run:
        working-directory: ./packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: dart pub get
      - run: ${{ matrix.test_command || 'dart test' }}
