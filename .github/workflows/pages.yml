name: deploy docs and sample app to GitHub Pages

on:
  push:
    branches:
      - master
    tags:
      - "v*"
      - "!v*-*" # Exclude prerelease tags, e.g. v0.10.0-dev.1
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  deploy:
    name: Deploy to GitHub Pages
    # Deploy master updates and stable release tags only.
    if: github.ref == 'refs/heads/master' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set documentation URL
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          sed -i -E "s|^url: .*|url: ${PAGES_BASE_URL}|" doc/retype.yml

      - name: Set documentation version from release tag
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sed -i -E "s/^  label: .*/  label: ${RELEASE_TAG}/" doc/retype.yml

      - name: Build documentation
        id: build_docs
        uses: retypeapp/action-build@latest

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build sample app
        working-directory: packages/demo
        run: |
          flutter pub get
          flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/app/"
          cp web/drift_worker.js build/web/drift_worker.js

      - name: Add sample app under /app
        env:
          SITE_DIR: ${{ steps.build_docs.outputs.retype-output-path }}
        run: cp -R packages/demo/build/web "$SITE_DIR/app"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.build_docs.outputs.retype-output-path }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
