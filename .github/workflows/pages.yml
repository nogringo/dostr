name: deploy demo to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.50.0"

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry_1.outputs.page_url || steps.deployment_retry_2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build demo
        working-directory: packages/demo
        run: |
          flutter pub get
          flutter build web --release --base-href "${{ steps.pages.outputs.base_path }}/"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: packages/demo/build/web

      # The artifact listing can lag behind the upload (actions/deploy-pages#451). Retry the deploy only: a second upload breaks the lookup.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait for the artifact listing
        if: steps.deployment.outcome == 'failure'
        run: sleep 10

      - name: Deploy to GitHub Pages (retry 1)
        id: deployment_retry_1
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Wait longer for the artifact listing
        if: steps.deployment_retry_1.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 2)
        id: deployment_retry_2
        if: steps.deployment_retry_1.outcome == 'failure'
        uses: actions/deploy-pages@v5
