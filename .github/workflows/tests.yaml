name: tests
on: [push, workflow_dispatch]
jobs:
  release-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash .github/scripts/tests/release-pr-title-test.sh

  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/ndk
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          # Pin to the Dart version bundled with Flutter stable (3.47.5).
          # Unpinned "latest" breaks analyze/test whenever a new Dart
          # stable changes diagnostics or formatter output.
          sdk: 3.13.4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:" # optional, change this to force refresh cache
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:" # optional, change this to specify the cache path
          architecture: x64 # optional, x64 or arm64
      - run: dart pub get
      - run: dart format --output=none .
      - run: dart analyze --no-fatal-warnings
      - run: dart test --coverage="coverage" -j 1
      - run: dart test ./example -j 2
      - run: dart pub global activate coverage
      - run: $HOME/.pub-cache/bin/format_coverage --ignore-files **/*.g.dart --lcov --check-ignore --in=coverage --out=coverage.lcov --report-on=lib
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          files: coverage.lcov
          # Forks have no token and Codecov rejects tokenless uploads on push.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          verbose: true # optional (default = false)

  cli-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/cli
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          # Pin to the Dart version bundled with Flutter stable (3.47.5).
          sdk: 3.13.4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:" # optional, change this to force refresh cache
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:" # optional, change this to specify the cache path
          architecture: x64 # optional, x64 or arm64
      - run: dart pub get
      - run: dart test

  addon-tests:
    name: ${{ matrix.package }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ndk_core, nip01, signer, auth, isolates, logger, http, nip19, bip340, nip44, nip49, nip77, rust_verifier, pq, url_set, fetchers, wallets, nwc, cashu, blossom]
    defaults:
      run:
        working-directory: ./packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          # Pin to the Dart version bundled with Flutter stable (3.47.5).
          sdk: 3.13.4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:" # optional, change this to force refresh cache
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:" # optional, change this to specify the cache path
          architecture: x64 # optional, x64 or arm64
      - run: dart pub get
      - run: dart test

  nip07-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./packages/ndk_flutter
    steps:
      - uses: actions/checkout@v7
      - uses: dart-lang/setup-dart@v1
        with:
          # Pin to the Dart version bundled with Flutter stable (3.47.5).
          sdk: 3.13.4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: "flutter-:os:-:channel:-:version:-:arch:-:hash:" # optional, change this to force refresh cache
          cache-path: "${{ runner.tool_cache }}/flutter/:channel:-:version:-:arch:" # optional, change this to specify the cache path
          architecture: x64 # optional, x64 or arm
      - run: dart pub get
      - run: dart analyze --no-fatal-warnings
      - run: flutter test --platform chrome --concurrency=2
