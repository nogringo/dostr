name: Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the release source
        uses: actions/checkout@v7

      - name: Prepare release notes from the dostr_core changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          awk -v heading="## ${version}" '
            $0 == heading { found = 1; next }
            found && $0 ~ /^## / { exit }
            found { print }
          ' packages/core/CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "No dostr_core changelog section found for ${version}." >&2
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" --title "Release $RELEASE_TAG" --notes-file release-notes.md "${flags[@]}"
