name: dostr_bip340
description: Pure Dart BIP-340 Schnorr signing and verification for Nostr, with an event signer and an event verifier.
version: 0.1.0
homepage: https://github.com/nogringo/dostr
repository: https://github.com/nogringo/dostr

topics:
  - nostr
  - dostr
  - schnorr

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  bip340: ">=0.3.0 <0.4.0"
  dostr_nip01: ^0.1.0
  dostr_nip44: ^0.1.0
  dostr_signer: ^0.1.0
  rxdart: ^0.28.0

dev_dependencies:
  dostr_event_verifier_test_suite: ^0.1.0
  lints: ^6.1.0
  test: any
