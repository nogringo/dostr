name: ndk_bip340
description: Pure Dart BIP-340 Schnorr signing and verification for NDK (Nostr Development Kit), with an event signer and an event verifier.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - schnorr

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  bip340: ">=0.3.0 <0.4.0"
  ndk_core: ^0.11.0-dev.2
  ndk_nip44: ^0.1.0
  rxdart: ^0.28.0

dev_dependencies:
  lints: ^6.1.0
  test: any
