name: dostr_flutter
description: "Flutter widgets for Nostr apps: login, profiles, account switching and pending signer requests, with accounts kept across restarts."
version: 0.10.3-dev.2
repository: https://github.com/nogringo/dostr
topics:
  - dostr
  - nostr
  - widgets

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.47.0"

resolution: workspace

dependencies:
  crypto: ">=3.0.0 <4.0.0"
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ">=8.0.0 <12.0.0"
  http: ">=1.0.0 <2.0.0"
  intl: ^0.20.3
  material_ui: ^1.11.0
  dostr_accounts: ^0.1.0
  dostr_bip340: ^0.1.0
  dostr_core: ^0.11.0-dev.2
  dostr_fetchers: ^0.1.0
  dostr_nip01: ^0.1.0
  dostr_nip07: ^0.1.0
  dostr_nip19: ^0.1.0
  dostr_nip46: ^0.1.0
  dostr_nip55: ^0.1.0
  dostr_rust_verifier: ^0.6.0
  dostr_signer: ^0.1.0
  dostr_web_crypto: ^0.1.0
  qr: ^4.0.1
  url_launcher: ">=6.0.0 <7.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
