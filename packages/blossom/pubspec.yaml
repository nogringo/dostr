name: dostr_blossom
description: Blossom file storage for Nostr, to upload, download, mirror and delete blobs on a user's Blossom servers.
version: 0.1.0
homepage: https://github.com/nogringo/dostr
repository: https://github.com/nogringo/dostr

topics:
  - nostr
  - dostr
  - blossom
  - files

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  async: ^2.13.0
  crypto: ^3.0.7
  http: ^1.6.0
  dostr_nip01: ^0.1.0
  dostr_signer: ^0.1.0
  web: ^1.1.1

dev_dependencies:
  lints: ^6.1.0
  dostr_accounts: ^0.1.0
  dostr_bip340: ^0.1.0
  test: ^1.31.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
