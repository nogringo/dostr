name: ndk_blossom
description: Blossom file storage for NDK (Nostr Development Kit), to upload, download, mirror and delete blobs and manage a user's Blossom server list.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - blossom
  - files

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  crypto: ^3.0.7
  http: ^1.6.0
  ndk: ^0.11.0-dev.2
  ndk_bip340: ^0.1.0
  ndk_core: ^0.11.0-dev.2
  ndk_isolates: ^0.1.0
  ndk_nip01: ^0.1.0
  ndk_signer: ^0.1.0
  rxdart: ^0.28.0
  web: ^1.1.1

dev_dependencies:
  lints: ^6.1.0
  test: any
  shelf: ^1.4.2
  shelf_router: ^1.1.4
