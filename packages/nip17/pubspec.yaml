name: ndk_nip17
description: NIP-17 private direct messages for NDK (Nostr Development Kit), with gift-wrapped text and encrypted file messages, conversations and DM relay lists.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - nip17
  - dm

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  crypto: ^3.0.7
  cryptography: ^2.9.0
  ndk: ^0.11.0-dev.2
  ndk_core: ^0.11.0-dev.2
  ndk_nip01: ^0.1.0

dev_dependencies:
  lints: ^6.1.0
  ndk_nip44: ^0.1.0
  test: any
