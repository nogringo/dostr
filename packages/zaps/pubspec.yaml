name: ndk_zaps
description: The zaps of NDK (Nostr Development Kit), to create NIP-57 zap requests, fetch LNURL-pay invoices and read zap receipts, without depending on ndk.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - zaps
  - lightning

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  ndk_core: ^0.11.0-dev.2
  ndk_http: ^0.1.0
  ndk_logger: ^0.1.0
  ndk_nip01: ^0.1.0
  ndk_signer: ^0.1.0

dev_dependencies:
  http: ^1.6.0
  lints: ^6.1.0
  ndk_bip340: ^0.1.0
  test: any
