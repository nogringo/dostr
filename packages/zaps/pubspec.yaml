name: dostr_zaps
description: NIP-57 zaps for Nostr, to create zap requests, fetch LNURL-pay invoices and read zap receipts.
version: 0.1.0
homepage: https://github.com/nogringo/dostr
repository: https://github.com/nogringo/dostr

topics:
  - nostr
  - dostr
  - zaps
  - lightning

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  http: ^1.6.0
  dostr_core: ^0.11.0-dev.2
  dostr_nip01: ^0.1.0
  dostr_signer: ^0.1.0

dev_dependencies:
  lints: ^6.1.0
  dostr_bip340: ^0.1.0
  test: any
