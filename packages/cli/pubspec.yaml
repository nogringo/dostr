name: ndk_cli
description: Command line interface for NDK (Nostr Development Kit).
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk
publish_to: none

executables:
  ndk: ndk

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  ndk: ^0.11.0-dev.1
  ndk_core: ^0.11.0-dev.2
  ndk_nip19: ^0.1.0
  ndk_rust_verifier: ^0.6.0
  ndk_sembast: ^0.1.0
  path: ^1.9.1
  ndk_cashu: ^0.1.0
  ndk_nwc: ^0.1.0
  ndk_wallets: ^0.1.0
  ndk_blossom: ^0.1.0

dev_dependencies:
  lints: ^6.1.0
  test: any
