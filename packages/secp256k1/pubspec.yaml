name: dostr_secp256k1
description: Pure Dart secp256k1 for Nostr and Cashu, the curve arithmetic and BIP-340 Schnorr signatures under dostr_bip340, dostr_nip44 and dostr_cashu_protocol.
version: 0.1.0
homepage: https://github.com/nogringo/dostr
repository: https://github.com/nogringo/dostr

topics:
  - nostr
  - dostr
  - secp256k1
  - cryptography

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  crypto: ^3.0.7

dev_dependencies:
  lints: ^6.1.0
  pointycastle: ">=3.0.0 <5.0.0"
  test: ^1.31.1
