  ndk_bip340: ^0.1.0
  ndk_core: ^0.11.0-dev.2
  ndk_nip01: ^0.1.0
  ndk_signer: ^0.1.0
  ndk_wallets: ^0.1.0
  pointycastle: ">=3.0.0 <5.0.0"
  rxdart: ^0.28.0

dev_dependencies:
  ndk_cache_manager_test_suite: ^1.0.1-dev.14
  lints: ^6.1.0
