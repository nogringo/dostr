name: ndk_http
description: The HTTP data source that NDK (Nostr Development Kit) packages share, with typed errors for non-2xx responses and streamed uploads and downloads.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - http

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  http: ^1.6.0
  rxdart: ^0.28.0

dev_dependencies:
  lints: ^6.1.0
  test: any
