name: ndk_nip82
description: NIP-82 software applications for NDK (Nostr Development Kit), to discover the application, release and asset events of a trusted publisher and pick a compatible Android update, without depending on ndk.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - nip82

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  ndk_core: ^0.11.0-dev.2
  ndk_nip01: ^0.1.0

dev_dependencies:
  lints: ^6.1.0
  ndk_mock_relay: ^0.1.0
  ndk: ^0.11.0-dev.2
  test: any
