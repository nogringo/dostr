name: ndk_rust
description: Native Rust crypto for NDK (Nostr Development Kit), with a fast BIP-340 event verifier, ML-DSA event signing and verification, and post-quantum hybrid encryption.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - rust
  - ffi

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  ndk_core: ^0.11.0-dev.2
  ndk_nip44: ^0.1.0
  hooks: ">=1.0.0 <3.0.0"
  native_toolchain_rust: ^1.0.7
  ffi: ^2.2.0

dev_dependencies:
  ndk_bip340: ^0.1.0
  lints: ^6.1.0
  test: any
