name: ndk_user_relay_lists
description: The relay lists of users for NDK (Nostr Development Kit), read from NIP-65 or NIP-02 and edited as the logged account, and the relay sets they give, without depending on ndk.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - outbox

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  ndk_cache: ^0.1.0
  ndk_core: ^0.11.0-dev.2
  ndk_follows: ^0.1.0
  ndk_lists: ^0.1.0
  ndk_logger: ^0.1.0
  ndk_nip01: ^0.1.0
  ndk_signer: ^0.1.0
  ndk_url_set: ^0.1.0

dev_dependencies:
  lints: ^6.1.0
  ndk_accounts: ^0.1.0
  ndk_bip340: ^0.1.0
  test: any
