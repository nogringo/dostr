name: dostr_nip46
description: NIP-46 remote signing for NDK (Nostr Development Kit), to connect to a bunker with a bunker:// or nostrconnect:// URL and sign and encrypt through it, without depending on ndk.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - nip46
  - signer

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  dostr_core: ^0.11.0-dev.2
  rxdart: ^0.28.0

dev_dependencies:
  lints: ^6.1.0
  dostr_mock_relay: ^0.1.0
  dostr_bip340: ^0.1.0
  dostr_nip44: ^0.1.0
  test: any
