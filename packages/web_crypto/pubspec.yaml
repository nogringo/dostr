name: dostr_web_crypto
description: Fast BIP-340 event signer and event verifier for NDK (Nostr Development Kit) on the web, with @noble/curves through JS interop.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - schnorr
  - web

platforms:
  web:

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  dostr_nip01: ^0.1.0
  dostr_signer: ^0.1.0
  rxdart: ^0.28.0
  web: ">=1.0.0 <2.0.0"

dev_dependencies:
  dostr_bip340: ^0.1.0
  dostr_event_verifier_test_suite: ^0.1.0
  lints: ^6.1.0
  test: any
