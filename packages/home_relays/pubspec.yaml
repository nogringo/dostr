name: dostr_home_relays
description: Computed Home Relays for Nostr, the relays every client derives from a pubkey to find its NIP-65 relay list, picked from a home-relays list.
version: 0.1.0
homepage: https://github.com/nogringo/dostr
repository: https://github.com/nogringo/dostr

topics:
  - nostr
  - dostr
  - outbox
  - nip65

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  crypto: ^3.0.7
  http: ^1.6.0
  dostr_nip01: ^0.1.0
  dostr_nip19: ^0.1.0
  dostr_url_set: ^0.1.0

dev_dependencies:
  lints: ^6.1.0
  dostr_bip340: ^0.1.0
  test: any
