[package]
name = "dostr_rust_verifier"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]


[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[dependencies]
hex = "0.4.3"
secp256k1 = { version = "0.31.1", features = ["global-context"] }
sha2 = "0.11.0"

[dev-dependencies]
serde_json = "1.0.128"
