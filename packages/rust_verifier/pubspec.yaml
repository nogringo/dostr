name: dostr_rust_verifier
description: Fast BIP-340 verifier for Nostr events, in native Rust called through FFI, for mobile and desktop apps.
version: 0.1.0
homepage: https://github.com/nogringo/dostr
repository: https://github.com/nogringo/dostr

topics:
  - nostr
  - dostr
  - rust
  - ffi

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  dostr_nip01: ^0.1.0
  hooks: ">=1.0.0 <3.0.0"
  native_toolchain_rust: ^1.0.7
  ffi: ^2.2.0

dev_dependencies:
  dostr_event_verifier_test_suite: ^0.1.0
  dostr_bip340: ^0.1.0
  lints: ^6.1.0
  test: ^1.31.1
