name: dostr_mock_relay
description: A NIP-01, NIP-42 and NIP-77 relay on a local port, with a NIP-46 remote signer, for the tests of the Dostr packages.
version: 0.1.0
homepage: https://github.com/nogringo/dostr
repository: https://github.com/nogringo/dostr
publish_to: 'none'

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  dostr_bip340: ^0.1.0
  dostr_core: ^0.1.0
  dostr_nip44: ^0.1.0
  dostr_nip77: ^0.1.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
