name: ndk
description: Nostr Development Kit - the most performant lib for all your nostr usecases
version: 0.11.0-dev.2
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  ndk_core: ^0.11.0-dev.2
  ndk_isolates: ^0.1.0
  ndk_nip01: ^0.1.0
  ndk_signer: ^0.1.0
  ndk_nip19: ^0.1.0
  ndk_bip340: ^0.1.0
  ndk_nip44: ^0.1.0
  ndk_nip49: ^0.1.0
  ndk_nip77: ^0.1.0
  ndk_url_set: ^0.1.0
  ndk_fetchers: ^0.1.0
  http: ^1.6.0
  crypto: ^3.0.7
  collection: ^1.19.1
  rxdart: ^0.28.0
  cryptography: ^2.9.0
  meta: ">=1.10.0 <2.0.0"

dev_dependencies:
  bip340: ">=0.3.0 <0.4.0"
  ndk_cache_manager_test_suite: ^1.0.1-dev.14
  # persistent cache for the local_first restart tests
  ndk_sembast: ^0.1.0
  build_runner: ">=2.11.0 <3.0.0"
  flutter_lints: ^6.0.0
  mockito: ">=5.6.3 <6.0.0"
  test: any
