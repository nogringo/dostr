name: dostr_fetchers
description: Fetches a user's kind:0 metadata, NIP-65 relay list, NIP-17 DM relay list, Blossom server list and home-relays list on top of dostr_core, and resolves a UrlSet with them.
version: 0.1.0
homepage: https://github.com/nogringo/dostr
repository: https://github.com/nogringo/dostr

topics:
  - nostr
  - dostr
  - outbox
  - nip65

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  dostr_core: ^0.11.0-dev.2
  dostr_home_relays: ^0.1.0
  dostr_url_set: ^0.1.0
  rxdart: ^0.28.0

dev_dependencies:
  lints: ^6.0.0
  dostr_bip340: ^0.1.0
  test: ^1.25.6
