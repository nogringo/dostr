name: dostr_fetchers
description: Fetches a user's metadata, relay lists, Blossom servers and home-relays list from their outbox, resolves a UrlSet with them, and fetches any filter from where it resolves.
version: 0.1.0
homepage: https://github.com/nogringo/dostr
repository: https://github.com/nogringo/dostr

topics:
  - nostr
  - dostr
  - outbox
  - nip65

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  dostr_blossom_url: ^0.1.0
  dostr_core: ^0.1.0
  dostr_home_relays: ^0.1.0
  dostr_url_set: ^0.1.0
  meta: ^1.15.0
  rxdart: ^0.28.0

dev_dependencies:
  lints: ^6.0.0
  dostr_bip340: ^0.1.0
  test: ^1.31.1
