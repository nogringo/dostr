name: ndk_fetchers
description: Fetches a user's kind:0 metadata, NIP-65 relay list, NIP-17 DM relay list, Blossom server list and home-relays list on top of ndk_core, and resolves a UrlSet with them.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - outbox
  - nip65

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  crypto: ^3.0.7
  http: ^1.6.0
  ndk_core: ^0.11.0-dev.2
  ndk_nip01: ^0.1.0
  ndk_nip19: ^0.1.0
  ndk_url_set: ^0.1.0
  rxdart: ^0.28.0

dev_dependencies:
  lints: ^6.0.0
  ndk_bip340: ^0.1.0
  test: ^1.25.6
