name: dostr_accounts
description: "Nostr accounts for Dart: log in with a private key, a public key, an external signer or a NIP-46 bunker, switch between them and sign as the logged one."
version: 0.1.0
homepage: https://github.com/nogringo/dostr
repository: https://github.com/nogringo/dostr

topics:
  - nostr
  - dostr
  - authentication

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  dostr_nip01: ^0.1.0
  dostr_signer: ^0.1.0
  rxdart: ^0.28.0

dev_dependencies:
  lints: ^6.1.0
  dostr_bip340: ^0.1.0
  test: ^1.31.1
