name: ndk_accounts
description: The accounts of NDK (Nostr Development Kit), to log in with a private key, a public key, an external signer or a NIP-46 bunker, switch between them and sign as the logged one, without depending on ndk.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - authentication

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  ndk_auth: ^0.1.0
  ndk_nip01: ^0.1.0
  ndk_nip46: ^0.1.0
  ndk_signer: ^0.1.0
  rxdart: ^0.28.0

dev_dependencies:
  lints: ^6.1.0
  ndk_bip340: ^0.1.0
  test: any
