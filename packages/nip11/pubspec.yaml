name: ndk_nip11
description: NIP-11 relay information for NDK (Nostr Development Kit), to fetch what a relay declares about itself, without depending on ndk or ndk_core.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - nip11

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  clock: ^1.1.2
  collection: ^1.19.1
  http: ^1.6.0

dev_dependencies:
  fake_async: ^1.3.3
  lints: ^6.1.0
  test: any
