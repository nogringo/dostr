name: dostr_cashu_protocol
description: "The Cashu ecash protocol in pure Dart, without Nostr: blind signatures, tokens, NUT-13 secrets and the mint API."
version: 0.1.0
homepage: https://github.com/nogringo/dostr
repository: https://github.com/nogringo/dostr

topics:
  - cashu
  - ecash
  - dostr

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  bip32_keys: ^3.1.4
  bip39_mnemonic: ^4.1.0
  cbor: ^6.5.1
  collection: ^1.19.1
  crypto: ^3.0.7
  dostr_secp256k1: ^0.1.0
  http: ^1.6.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.31.1
