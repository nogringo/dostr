name: ndk_broadcast_queue
description: Persisted broadcast queue for NDK (Nostr Development Kit), to keep an event on its way to every relay across offline periods, remote signing and restarts, without depending on ndk.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - offline

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  ndk_logger: ^0.1.0
  ndk_nip01: ^0.1.0
  ndk_signer: ^0.1.0
  ndk_url_set: ^0.1.0

dev_dependencies:
  lints: ^6.1.0
  ndk: ^0.11.0-dev.2
  ndk_cache: ^0.1.0
  ndk_accounts: ^0.1.0
  ndk_bip340: ^0.1.0
  ndk_core: ^0.11.0-dev.2
  test: any
