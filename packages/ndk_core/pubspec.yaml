name: ndk_core
description: The core of NDK (Nostr Development Kit) - relay connections, NIP-42 authentication, and REQ and EVENT on the relays you pick.
version: 0.11.0-dev.2
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  ndk_auth: ^0.1.0
  ndk_isolates: ^0.1.0
  ndk_logger: ^0.1.0
  ndk_nip01: ^0.1.0
  ndk_signer: ^0.1.0
  rxdart: ^0.28.0
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  crypto: ^3.0.7
  lints: ^6.1.0
  ndk_mock_relay: ^0.1.0
  test: any
