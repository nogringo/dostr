name: ndk_core
description: The core of NDK (Nostr Development Kit) - relay connections, NIP-42 authentication, and REQ and EVENT on the relays you pick.
version: 0.11.0-dev.2
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  convert: ^3.1.2
  crypto: ^3.0.7
  cryptography: ^2.9.0
  elliptic: ^0.4.0
  http: ^1.6.0
  meta: ">=1.10.0 <2.0.0"
  pointycastle: ">=3.0.0 <5.0.0"
  rxdart: ^0.28.0
  web: ^1.1.1
  web_socket_channel: ^3.0.3

dev_dependencies:
  lints: ^6.1.0
  mocktail: ^1.0.5
  test: any
