name: ndk_pq
description: Post-quantum crypto for NDK (Nostr Development Kit) in native Rust, with ML-DSA event signing and verification and ML-KEM hybrid encryption.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - post-quantum
  - ffi

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

dependencies:
  ndk_nip01: ^0.1.0
  ndk_signer: ^0.1.0
  ndk_nip44: ^0.1.0
  hooks: ">=1.0.0 <3.0.0"
  native_toolchain_rust: ^1.0.7
  ffi: ^2.2.0

dev_dependencies:
  ndk_event_verifier_test_suite: ^0.1.0
  lints: ^6.1.0
  test: any
