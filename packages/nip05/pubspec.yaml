name: ndk_nip05
description: NIP-05 identifiers for NDK (Nostr Development Kit), to resolve a name@domain address to a pubkey and its relays and verify it, with caching and request deduplication, without depending on ndk.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - nip05

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  http: ^1.6.0

dev_dependencies:
  lints: ^6.1.0
  test: any
