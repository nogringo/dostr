name: ndk_cache
description: The cache of NDK (Nostr Development Kit), the CacheManager contract that cache backends implement, the in-memory MemCacheManager and the records they store, without depending on ndk.
version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - cache

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  ndk_broadcast_queue: ^0.1.0
  ndk_follows: ^0.1.0
  ndk_lists: ^0.1.0
  ndk_logger: ^0.1.0
  ndk_metadata: ^0.1.0
  ndk_nip01: ^0.1.0
  ndk_nip05: ^0.1.0
  ndk_nip11: ^0.1.0
  ndk_nip59: ^0.1.0
  ndk_url_set: ^0.1.0

dev_dependencies:
  build_runner: ">=2.11.0 <3.0.0"
  lints: ^6.1.0
  mockito: ">=5.6.3 <6.0.0"
  ndk_cache_manager_test_suite: ^1.0.1-dev.14
  test: any
