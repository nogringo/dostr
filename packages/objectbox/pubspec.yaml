name: ndk_objectbox
description: Nostr Development Kit - the most performant lib for all your nostr usecases
version: 0.3.1-dev.1
homepage: https://github.com/relaystr/ndk

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  objectbox: ^5.3.1
  objectbox_flutter_libs: ^5.3.1
  ndk_broadcast_queue: ^0.1.0
  ndk_cache: ^0.1.0
  ndk_core: ^0.11.0-dev.2
  ndk_follows: ^0.1.0
  ndk_metadata: ^0.1.0
  ndk_nip01: ^0.1.0
  ndk_nip05: ^0.1.0
  ndk_nip11: ^0.1.0
  flat_buffers: ^25.9.23
  path_provider: ^2.1.6
  path: ^1.9.1
  http: ^1.6.0
  crypto: ^3.0.7
  ndk_cashu: ^0.1.0
  ndk_wallets: ^0.1.0

dev_dependencies:
  ndk: ^0.11.0-dev.2
  ndk_cache_manager_test_suite: ^1.0.1-dev.14
  build_runner: ">=2.11.0 <3.0.0"
  mockito: ">=5.6.3 <6.0.0"
  objectbox_generator: ^5.3.1
  test: any
  flutter_test:
    sdk: flutter
