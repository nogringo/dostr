version: 0.1.0
homepage: https://github.com/relaystr/ndk
repository: https://github.com/relaystr/ndk

topics:
  - nostr
  - ndk
  - nip59
  - encryption

environment:
  sdk: ">=3.9.0 <4.0.0"

resolution: workspace

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

dependencies:
  ndk_nip01: ^0.1.0
  ndk_signer: ^0.1.0

dev_dependencies:
  lints: ^6.1.0
  ndk_bip340: ^0.1.0
  test: any
